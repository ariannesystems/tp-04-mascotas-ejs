<svg viewBox="0 0 200 200" width="400" height="400">
  <!-- Fondo -->
  <circle cx="100" cy="100" r="95" fill="#f4f4f4" />
  
  <!-- Oreja Izquierda (Caída - característica de mestizo) -->
  <path d="M 65 75 Q 25 45 35 115 Q 55 130 75 95" fill="#654321" />
  
  <!-- Oreja Derecha (Levantada) -->
  <path d="M 135 75 Q 175 25 165 85 Q 155 110 125 95" fill="#8b5a2b" />
  
  <!-- Cabeza principal -->
  <ellipse cx="100" cy="100" rx="45" ry="40" fill="#a0522d" />
  
  <!-- Mancha en el ojo derecho -->
  <ellipse cx="115" cy="85" rx="15" ry="18" fill="#654321" />
  
  <!-- Hocico -->
  <ellipse cx="100" cy="118" rx="28" ry="22" fill="#f5deb3" />
  
  <!-- Nariz -->
  <ellipse cx="100" cy="110" rx="9" ry="6" fill="#1a1a1a" />
  <ellipse cx="97" cy="108" rx="3" ry="2" fill="#ffffff" opacity="0.5" />
  
  <!-- Ojos -->
  <circle cx="85" cy="90" r="6" fill="#1a1a1a" />
  <circle cx="115" cy="90" r="6" fill="#1a1a1a" />
  
  <!-- Brillo de los ojos -->
  <circle cx="83" cy="88" r="2" fill="#ffffff" />
  <circle cx="113" cy="88" r="2" fill="#ffffff" />
  
  <!-- Boca -->
  <path d="M 90 122 Q 100 132 110 122" stroke="#1a1a1a" stroke-width="2" fill="transparent" stroke-linecap="round" />
  <path d="M 100 116 L 100 127" stroke="#1a1a1a" stroke-width="2" fill="transparent" />
  
  <!-- Lengua asomando -->
  <path d="M 95 127 Q 100 140 105 127" fill="#ff6b6b" />
</svg>